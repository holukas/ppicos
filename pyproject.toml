[project]
name = "ppicos"
version = "6.0.0"
description = "Convert data files to ICOS-conform file formats."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Lukas Hörtnagl", email = "holukas@ethz.ch"}]
requires-python = ">=3.12"
dependencies = [
    "pandas>=1.5.3",
    "Jinja2>=3.1.2",
]
keywords = ["ICOS", "flux tower", "data processing", "CH-DAV"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]

[project.urls]
Repository = "https://github.com/holukas/ppicos"

[project.scripts]
ppicos = "ppicos:start_ALL"

[tool.hatch.build.targets.wheel]
packages = ["ppicos"]

[tool.uv]
dev-dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
